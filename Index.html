<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Attendance System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff, #e0f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 25px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.12);
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 22px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      box-shadow: 0 10px 25px rgba(37,99,235,0.25);
    }

    h1 {
      margin-top: 18px;
      color: #172554;
      font-size: 28px;
    }

    .subtitle {
      color: #64748b;
      margin-top: 8px;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .card {
      background: #f8fafc;
      border-radius: 18px;
      padding: 20px;
      text-align: left;
      margin-bottom: 15px;
      border: 1px solid #e2e8f0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #334155;
      margin-bottom: 7px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: white;
      font-size: 15px;
    }

    input:focus, select:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 13px;
      background: linear-gradient(135deg, #2563eb, #0891b2);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 8px 20px rgba(37,99,235,0.20);
    }

    button:active {
      transform: scale(0.98);
    }

    .qr {
      font-size: 70px;
      margin: 10px 0;
    }

    .status {
      display: none;
      padding: 13px;
      margin-top: 15px;
      border-radius: 12px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      font-size: 14px;
    }

    .footer {
      margin-top: 22px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🏥</div>

    <h1>Smart Attendance</h1>

    <p class="subtitle">
      Hospital-wise QR Attendance System
    </p>

    <div class="card">

      <label>Hospital / Facility</label>

      <select id="hospital">
        <option value="">Select Hospital</option>
        <option>ANMTC Sawai Madhopur</option>
        <option>CMHO Sawai Madhopur</option>
        <option>District Hospital</option>
        <option>CHC</option>
        <option>PHC</option>
      </select>

    </div>

    <div class="card">

      <label>Employee / Student Name</label>

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
      >

      <br><br>

      <label>Employee ID / Roll Number</label>

      <input
        type="text"
        id="id"
        placeholder="Enter ID / Roll No."
      >

      <button onclick="markAttendance()">
        ✓ Mark Attendance
      </button>

      <div class="status" id="status">
        Attendance submitted successfully!
      </div>

    </div>

    <div class="card">

      <div class="qr">▦</div>

      <h3 style="text-align:center;color:#172554;">
        Scan Hospital QR
      </h3>

      <p style="text-align:center;color:#64748b;font-size:13px;margin-top:7px;">
        QR scanning & secure attendance will be connected with Firebase.
      </p>

    </div>

    <div class="footer">
      © 2026 Smart Attendance System
    </div>

  </div>

  <script>

    function markAttendance() {

      const hospital = document.getElementById("hospital").value;
      const name = document.getElementById("name").value.trim();
      const id = document.getElementById("id").value.trim();
      const status = document.getElementById("status");

      if (!hospital) {
        alert("Please select your hospital.");
        return;
      }

      if (!name) {
        alert("Please enter your name.");
        return;
      }

      if (!id) {
        alert("Please enter your Employee ID / Roll Number.");
        return;
      }

      status.style.display = "block";

      status.innerHTML =
        "✓ Attendance submitted for " +
        name +
        " at " +
        hospital;

    }

  </script>

</body>
</html>
